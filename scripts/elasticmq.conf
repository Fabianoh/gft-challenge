// Fila de consolidação e sua DLQ, espelhando infra/cfn/sqs_sns.yml.
include classpath("application.conf")

node-address {
  protocol = http
  host = "localhost"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  "gft-challenge-local-consolidacao-queue" {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "gft-challenge-local-consolidacao-dlq"
      maxReceiveCount = 3
    }
  }
  "gft-challenge-local-consolidacao-dlq" {
    defaultVisibilityTimeout = 300 seconds
  }
}
