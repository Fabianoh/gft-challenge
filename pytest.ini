[pytest]
# Cada serviço é testado em seu próprio processo (ver tests/conftest.py).
# Use `make test` para rodar os dois.
addopts = --strict-markers --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning:botocore.*
