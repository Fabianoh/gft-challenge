AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  ProjectName:
    Type: String
  Environment:
    Type: String
  KMSKey:
    Type: String
  RedisEndpoint:
    Type: String
  RedisPort:
    Type: String

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/database'
      Description: 'Credenciais e configurações do banco de dados'
      SecretString: !Sub |
        {
          "redis_endpoint": "${RedisEndpoint}",
          "redis_port": "${RedisPort}",
          "kms_key_id": "${KMSKey}",
          "environment": "${Environment}"
        }
      KmsKeyId: !Ref KMSKey
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-database-secret'
        - Key: Environment
          Value: !Ref Environment

  # Segredo de assinatura dos tokens JWT, consumido pelo Lambda Authorizer.
  # Gerado pelo CloudFormation: o valor nunca passa por parâmetro de stack, por
  # variável de ambiente nem pelo repositório.
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Environment}/jwt'
      Description: 'Segredo de assinatura HMAC dos tokens de acesso da API'
      GenerateSecretString:
        SecretStringTemplate: '{"algoritmo": "HS256"}'
        GenerateStringKey: 'jwt_secret'
        PasswordLength: 64
        ExcludePunctuation: true
      KmsKeyId: !Ref KMSKey
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-jwt-secret'
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DatabaseSecret:
    Value: !Ref DatabaseSecret

  JwtSecret:
    Value: !Ref JwtSecret

  JwtSecretArn:
    Value: !Ref JwtSecret
