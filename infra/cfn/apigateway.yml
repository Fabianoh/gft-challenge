AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  ProjectName:
    Type: String
  Environment:
    Type: String
  KMSKey:
    Type: String
  RedisEndpoint:
    Type: String
  RedisPort:
    Type: String
  LambdaConsolidadoArn:
    Type: String
  LambdaLancamentosArn:
    Type: String
  LambdaAuthorizerArn:
    Type: String

  RetencaoLogsEmDias:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]

  # Throttling separado por servico. Antes existia um unico limite no stage
  # inteiro, entao trafego no consolidado consumia a cota dos lancamentos e um
  # pico de leitura podia causar HTTP 429 no caminho de receita.
  LimiteRpsLancamentos:
    Type: Number
    Default: 200
    Description: Requisicoes por segundo no dominio de lancamentos

  LimiteRpsConsolidado:
    Type: Number
    Default: 80
    Description: >-
      Requisicoes por segundo no dominio de consolidado. Acima dos 50 rps do
      requisito nao-funcional, com folga para rajada.

Resources:
  APIGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-apigateway-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
      Policies:
        - PolicyName: LambdaInvokeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Ref LambdaConsolidadoArn
                  - !Ref LambdaLancamentosArn

  APIGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-apigateway-cloudwatch-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  
  # API Gateway Account Config para CloudWatch Logs
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt APIGatewayCloudWatchRole.Arn
    DependsOn: APIGatewayCloudWatchRole

  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-api'
      Description: 'API Gateway para sistema de controle de fluxo de caixa'
      EndpointConfiguration:
        Types:
          - REGIONAL
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: execute-api:Invoke
            Resource: '*'
            Condition:
              IpAddress:
                aws:SourceIp: '0.0.0.0/0'  # Permitir todos IPs - ajustar conforme necessário
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-api'
        - Key: Environment
          Value: !Ref Environment

  # Request Validator
  # ===========================================================================
  # Autenticacao
  # ===========================================================================
  # Tipo REQUEST (e nao TOKEN) porque o autorizador decide o escopo exigido a
  # partir do metodo e do caminho, e nao apenas do token. Um PDV com escopo
  # `lancamentos:write` pode gravar mas nao pode ler o saldo consolidado — essa
  # decisao depende de saber qual recurso esta sendo acessado.
  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-jwt-authorizer'
      RestApiId: !Ref ApiGateway
      Type: REQUEST
      IdentitySource: method.request.header.Authorization
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizerArn}/invocations'
      AuthorizerCredentials: !GetAtt AuthorizerInvocationRole.Arn
      # Cache do resultado por identidade. Sem cache, o autorizador roda em toda
      # requisicao e vira custo e latencia fixos no caminho critico.
      AuthorizerResultTtlInSeconds: 300

  # Role que o API Gateway assume para invocar o autorizador.
  AuthorizerInvocationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-authorizer-invocation'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvocaAuthorizer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref LambdaAuthorizerArn

  # Respostas 401 e 403 precisam carregar os cabecalhos de CORS. Sem isso, o
  # navegador reporta erro de CORS em vez do erro de autenticacao real, e o
  # desenvolvedor do cliente perde tempo investigando o problema errado.
  RespostaNaoAutorizado:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: UNAUTHORIZED
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      ResponseTemplates:
        application/json: '{"error":"Nao autorizado","message":"Token ausente ou invalido"}'

  RespostaAcessoNegado:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: ACCESS_DENIED
      StatusCode: '403'
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      ResponseTemplates:
        application/json: '{"error":"Acesso negado","message":"Escopo insuficiente para este recurso"}'

  RequestValidator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      RestApiId: !Ref ApiGateway
      Name: !Sub '${ProjectName}-${Environment}-validator'
      ValidateRequestBody: true
      ValidateRequestParameters: true
    DependsOn:
      - ApiGateway

  # API Gateway Resources
  LancamentosResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: lancamentos
    DependsOn:
      - ApiGateway

  LancamentoIndividualResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref LancamentosResource
      PathPart: '{id}'
    DependsOn:
      - ApiGateway

  
  ConsolidadoResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: consolidado
    DependsOn:
      - ApiGateway
    
  ConsolidadoRelatorioResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref ConsolidadoResource
      PathPart: relatorio
    DependsOn:
      - ApiGateway

  
  HealthCheckResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: health
    DependsOn:
      - ApiGateway

  MetricasResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: metricas

  # Models para validação
  LancamentoModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref ApiGateway
      ContentType: application/json
      Name: LancamentoModel
      Schema:
        $schema: 'http://json-schema.org/draft-04/schema#'
        title: Lancamento Schema
        type: object
        required:
          - tipo
          - valor
          - descricao
        properties:
          tipo:
            type: string
            enum: ['DEBITO', 'CREDITO']
          valor:
            type: number
            minimum: 0.01
          descricao:
            type: string
            minLength: 1
            maxLength: 255
          data:
            type: string
            format: date
    DependsOn:
      - ApiGateway

  # API Gateway Methods com Request Validation
  LancamentosMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref LancamentosResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      RequestValidatorId: !Ref RequestValidator
      RequestModels:
        application/json: !Ref LancamentoModel
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaLancamentosArn}/invocations'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
          - StatusCode: 400
            SelectionPattern: '.*"statusCode":400.*'
          - StatusCode: 500
            SelectionPattern: '.*"statusCode":500.*'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
        - StatusCode: 400
        - StatusCode: 500
    DependsOn:
      - LancamentosResource
      - RequestValidator
      - LancamentoModel

  LancamentoListGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref LancamentosResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaLancamentosArn}/invocations'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
          - StatusCode: 404
            SelectionPattern: '.*"statusCode":404.*'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
        - StatusCode: 404
    DependsOn:
      - LancamentosResource

  LancamentoIndividualGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref LancamentoIndividualResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaLancamentosArn}/invocations'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
          - StatusCode: 404
            SelectionPattern: '.*"statusCode":404.*'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
        - StatusCode: 404
    DependsOn:
      - LancamentoIndividualResource

  # OPTIONS para CORS - /lancamentos
  LancamentosOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref LancamentosResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Headers: false
    DependsOn:
      - LancamentosResource

  # OPTIONS para CORS - /lancamentos/{id}
  LancamentoIndividualOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref LancamentoIndividualResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Headers: false
    DependsOn:
      - LancamentoIndividualResource

  ConsolidadoMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ConsolidadoResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      RequestParameters:
        method.request.querystring.data: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaConsolidadoArn}/invocations'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
        RequestTemplates:
          application/json: |
            {
              "queryStringParameters": {
                #foreach($param in $input.params().querystring.keySet())
                "$param": "$util.escapeJavaScript($input.params().querystring.get($param))"
                #if($foreach.hasNext),#end
                #end
              }
            }
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
    DependsOn:
      - ConsolidadoResource


  ConsolidadoRelatorioMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ConsolidadoRelatorioResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      RequestParameters:
        method.request.querystring.data_inicio: true
        method.request.querystring.data_fim: true
        method.request.querystring.formato: false
        method.request.querystring.incluir_detalhes: false
        method.request.querystring.agrupar_por: false
        method.request.querystring.salvar_s3: false
        method.request.querystring.email_relatorio: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaConsolidadoArn}/invocations'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
          - StatusCode: 400
            SelectionPattern: '.*"statusCode":400.*'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
        - StatusCode: 400
    DependsOn:
      - ConsolidadoRelatorioResource

  ConsolidadoRelatorioOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ConsolidadoRelatorioResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Headers: false
    DependsOn:
        - ConsolidadoRelatorioResource


  HealthCheckMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref HealthCheckResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationHttpMethod: GET
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: !Sub |
                {
                  "status": "healthy",
                  "timestamp": "$context.requestTime",
                  "environment": "${Environment}"
                }
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
    DependsOn:
      - HealthCheckResource


  MetricasMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref MetricasResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      RequestParameters:
        method.request.querystring.periodo: false
        method.request.querystring.incluir_tendencias: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaConsolidadoArn}/invocations'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
    DependsOn:
      - MetricasResource

  MetricasOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref MetricasResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Headers: false
    DependsOn:
      - MetricasResource

     
  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment    
    Properties:
      RestApiId: !Ref ApiGateway
    DependsOn:
      - LancamentosMethod
      - LancamentoListGetMethod
      - LancamentosOptionsMethod
      - LancamentoIndividualOptionsMethod
      - LancamentoIndividualGetMethod      
      - ConsolidadoMethod
      - ConsolidadoRelatorioMethod
      - ConsolidadoRelatorioOptionsMethod
      - HealthCheckMethod
      - MetricasMethod
      - MetricasOptionsMethod
      

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}-${Environment}'
      RetentionInDays: !Ref RetencaoLogsEmDias

  # Stage com configurações de segurança
  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApiGateway
      DeploymentId: !Ref ApiGatewayDeployment
      StageName: !Ref Environment      
      MethodSettings:
        # Padrao conservador para qualquer recurso nao listado abaixo.
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingRateLimit: 100
          ThrottlingBurstLimit: 200

        # Lancamentos: cota propria e mais alta. E o caminho de receita — uma
        # venda nao registrada e irrecuperavel.
        #
        # O metodo HTTP precisa ser nomeado. O API Gateway so aceita curinga na
        # combinacao '/*' + '*'; usar '*' com um ResourcePath especifico produz
        # um caminho invalido ('lancamentos/*') e a criacao do stage falha.
        - ResourcePath: '/lancamentos'
          HttpMethod: 'POST'
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingRateLimit: !Ref LimiteRpsLancamentos
          ThrottlingBurstLimit: !Ref LimiteRpsLancamentos

        - ResourcePath: '/lancamentos'
          HttpMethod: 'GET'
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingRateLimit: !Ref LimiteRpsLancamentos
          ThrottlingBurstLimit: !Ref LimiteRpsLancamentos

        - ResourcePath: '/lancamentos/{id}'
          HttpMethod: 'GET'
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingRateLimit: !Ref LimiteRpsLancamentos
          ThrottlingBurstLimit: !Ref LimiteRpsLancamentos

        # Consolidado: cota separada, dimensionada para os 50 rps do requisito
        # nao-funcional com folga. Um pico aqui nao consome a cota acima.
        - ResourcePath: '/consolidado'
          HttpMethod: 'GET'
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingRateLimit: !Ref LimiteRpsConsolidado
          ThrottlingBurstLimit: !Ref LimiteRpsConsolidado

        - ResourcePath: '/consolidado/relatorio'
          HttpMethod: 'GET'
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingRateLimit: !Ref LimiteRpsConsolidado
          ThrottlingBurstLimit: !Ref LimiteRpsConsolidado
      AccessLogSetting:
        # Estava comentado: o log de acesso nao ia para lugar nenhum, e com ele
        # se perdia a rastreabilidade de borda (requestId, IP, status, latencia).
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: >
          {"requestId": "$context.requestId", "ip": "$context.identity.sourceIp", "caller": "$context.identity.caller", "user": "$context.identity.user", "requestTime": "$context.requestTime", "httpMethod": "$context.httpMethod", "resourcePath": "$context.resourcePath", "status": "$context.status", "protocol": "$context.protocol", "responseLength": "$context.responseLength", "error": "$context.error.message", "integrationError": "$context.integration.error"}
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-stage'
        - Key: Environment
          Value: !Ref Environment
    DependsOn: 
      - ApiGatewayDeployment

  
  # Lambda Permissions
  LambdaLancamentosPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaLancamentosArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*'

  LambdaConsolidadoPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaConsolidadoArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*'


  # ===== WAF para API Gateway =====
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-waf'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      Rules:
        # Rate limiting por IDENTIDADE, nao por IP.
        #
        # A regra anterior usava AggregateKeyType: IP com Limit 1000. No WAFv2 o
        # Limit e por janela de 5 minutos, ou seja ~3,3 req/s por IP. Isso
        # bloquearia exatamente a carga que o requisito nao-funcional exige: 50
        # rps sao 15.000 requisicoes em 5 minutos, quinze vezes o limite. E o
        # cenario e o comum, nao o excepcional — uma rede de lojas sai por um NAT
        # corporativo e todo o trafego chega com um unico IP de origem.
        #
        # Agregar pelo cabecalho Authorization limita o abuso de um cliente
        # individual sem punir um cliente legitimo de alto volume.
        - Name: RateLimitPorIdentidade
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: 20000            # ~66 req/s por identidade, folga sobre os 50 rps
              AggregateKeyType: CUSTOM_KEYS
              CustomKeys:
                - Header:
                    Name: authorization
                    TextTransformations:
                      - Priority: 0
                        Type: NONE
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPorIdentidade

        # Rede de seguranca por IP, com teto bem mais alto: protege contra flood
        # de origem nao autenticada sem interferir no trafego legitimo.
        - Name: RateLimitPorIpAmplo
          Priority: 4
          Statement:
            RateBasedStatement:
              Limit: 50000
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPorIpAmplo
        - Name: SQLInjectionRule
          Priority: 2
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: SQLInjectionRule
        - Name: CommonRuleSet
          Priority: 3
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSet
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}${Environment}WebACL'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-waf'
        - Key: Environment
          Value: !Ref Environment
    DependsOn:
      - ApiGatewayStage

  # Associação WAF com API Gateway
  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${ApiGateway}/stages/${Environment}'
      WebACLArn: !GetAtt WebACL.Arn
    DependsOn:
      - WebACL


Outputs:
  ApiGatewayID:
    Value:
      Ref: ApiGateway

  ApiGatewayUrl:
    Description: 'URL base do API Gateway'
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-api-gateway'

  HealthCheckEndpoint:
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/health'

  LancamentosEndpoint:
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/lancamentos'
  
  ConsolidadoEndpoint:
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/consolidado'